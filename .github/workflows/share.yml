name: ClipFx Share

on:
  push:
    paths: ["share/**", ".github/workflows/share.yml"]
  workflow_dispatch:

jobs:
  cores:
    name: Engines, interop, Android build and emulator test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: .NET engine tests
        run: dotnet test share/windows/tests/ClipFx.Share.Tests -c Release
      - name: Build CLI + APKs + Kotlin tests
        working-directory: share/android
        run: |
          dotnet build ../windows/tools/ClipFx.Share.Cli -c Release
          ./gradlew --no-daemon :core:test :core:installDist :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Interop (.NET <-> Kotlin, both ways)
        run: share/scripts/interop.sh 200
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: share/scripts/android-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: share/android-e2e/
      - uses: actions/upload-artifact@v4
        with:
          name: ClipFxShare-apk
          path: share/android/app/build/outputs/apk/release/app-release.apk

  windows:
    name: Windows app, installer and real test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Engine tests
        run: dotnet test share/windows/tests/ClipFx.Share.Tests -c Release
      - name: Publish
        run: |
          dotnet publish share/windows/src/ClipFx.Share.App -c Release -r win-x64 --self-contained true -p:DebugType=none -o share/publish
          dotnet build share/windows/tools/ClipFx.Share.Cli -c Release
      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" } else { $iscc = $iscc.Source }
          & $iscc share\installer\ClipFxShare.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real Windows test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem share\dist\ClipFxShareSetup-*.exe | Select-Object -First 1).FullName
          ./share/scripts/windows-test.ps1 -Setup $setup -Cli "$PWD\share\windows\tools\ClipFx.Share.Cli\bin\Release\net8.0\ClipFx.Share.Cli.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: ClipFxShareSetup
          path: share/dist/ClipFxShareSetup-*.exe
