name: ClipFx Share

on:
  push:
    paths: ["share/**", ".github/workflows/share.yml"]
  workflow_dispatch:

jobs:
  cores:
    name: Engines, interop, Android build and emulator test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: .NET engine tests
        run: dotnet test share/windows/tests/ClipFx.Share.Tests -c Release
      - name: Build CLI + APKs + Kotlin tests
        working-directory: share/android
        run: |
          dotnet build ../windows/tools/ClipFx.Share.Cli -c Release
          ./gradlew --no-daemon :core:test :core:installDist :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Interop (.NET <-> Kotlin, both ways)
        run: share/scripts/interop.sh 200
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: share/scripts/android-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: share/android-e2e/
      - uses: actions/upload-artifact@v4
        with:
          name: ClipFxShare-apk
          path: share/android/app/build/outputs/apk/release/app-release.apk
