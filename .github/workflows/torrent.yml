name: ClipFx Torrent

on:
  push:
    paths: ["torrent/**", ".github/workflows/torrent.yml"]
  workflow_dispatch:

jobs:
  engine:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Engine tests
        run: dotnet test torrent/tests/ClipFx.Torrent.Tests -c Release --logger "console;verbosity=normal"
      - name: DHT routers reachable (network check)
        run: |
          python3 - <<'PY'
          import socket
          msg=b'd1:ad2:id20:abcdefghij0123456789e1:q4:ping1:t2:aa1:y1:qe'
          for h,p in [("router.bittorrent.com",6881),("dht.transmissionbt.com",6881),("router.utorrent.com",6881),("dht.libtorrent.org",25401)]:
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(4)
              try:
                  ip=socket.gethostbyname(h); s.sendto(msg,(ip,p)); print(h, ip, 'replied', len(s.recv(1500)), 'bytes')
              except Exception as e: print(h, '->', e)
          PY
      - name: DHT joins the network (internet)
        env: { CFT_INTERNET: "1" }
        run: dotnet test torrent/tests/ClipFx.Torrent.Tests -c Release --filter "FullyQualifiedName~Dht" --logger "console;verbosity=detailed"

  windows:
    name: Windows app, installer and real download test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Engine tests
        run: dotnet test torrent/tests/ClipFx.Torrent.Tests -c Release --logger "console;verbosity=normal"
      - name: Publish
        run: |
          dotnet publish torrent/src/ClipFx.Torrent.App -c Release -r win-x64 --self-contained true -p:DebugType=none -o torrent/publish
          dotnet build torrent/tools/ClipFx.Torrent.Seed -c Release
      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" } else { $iscc = $iscc.Source }
          & $iscc torrent\installer\ClipFxTorrent.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real Windows test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem torrent\dist\ClipFxTorrentSetup-*.exe | Select-Object -First 1).FullName
          ./torrent/scripts/windows-test.ps1 -Setup $setup -Seed "$PWD\torrent\tools\ClipFx.Torrent.Seed\bin\Release\net8.0\ClipFx.Torrent.Seed.dll"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torrent-windows-shots
          path: torrent/test-shots/
      - uses: actions/upload-artifact@v4
        with:
          name: ClipFxTorrentSetup
          path: torrent/dist/ClipFxTorrentSetup-*.exe
